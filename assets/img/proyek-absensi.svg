  <!-- radius GPS lokasi kerja -->
  <g transform="translate(728 196)">
    <circle r="92" fill="#5769E0" opacity=".10"/>
    <circle r="92" fill="none" stroke="#5769E0" stroke-width="2" stroke-dasharray="7 7"/>

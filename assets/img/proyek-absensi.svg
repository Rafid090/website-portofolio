<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" overflow="hidden" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <!-- Ilustrasi (bukan data asli): laporan absensi harian dengan penanda pelanggaran, radius GPS, jam, dan ekspor PDF -->

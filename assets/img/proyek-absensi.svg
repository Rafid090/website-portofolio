    <circle r="40" fill="none" stroke="#F0A020" stroke-width="5"/>
    <path d="M0 -22V0l15 10" fill="none" stroke="#3A3F55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ekspor PDF -->
  <g transform="translate(772 336)">
